x-rustfs-client-environment: &rustfs-client-environment
  MAGIC_COMPARE_HIDE_DEMO: "false"
  MAGIC_COMPARE_S3_BUCKET: ${MAGIC_COMPARE_RUSTFS_BUCKET:-magic-compare-local}
  MAGIC_COMPARE_S3_REGION: us-east-1
  MAGIC_COMPARE_S3_ENDPOINT: http://rustfs:9000
  MAGIC_COMPARE_S3_PUBLIC_BASE_URL: http://127.0.0.1:${MAGIC_COMPARE_RUSTFS_HOST_PORT:-9000}/${MAGIC_COMPARE_RUSTFS_BUCKET:-magic-compare-local}
  MAGIC_COMPARE_S3_ACCESS_KEY_ID: ${MAGIC_COMPARE_RUSTFS_ACCESS_KEY:-rustfsadmin}
  MAGIC_COMPARE_S3_SECRET_ACCESS_KEY: ${MAGIC_COMPARE_RUSTFS_SECRET_KEY:-rustfsadmin}
  MAGIC_COMPARE_S3_FORCE_PATH_STYLE: "true"
  MAGIC_COMPARE_S3_INTERNAL_PREFIX: ""

x-local-internal-site: &local-internal-site
  image: magic-compare/internal-site:local
  build:
    context: .
    dockerfile: docker/internal-site.Dockerfile

services:
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    init: true
    ports:
      - "${MAGIC_COMPARE_RUSTFS_HOST_PORT:-9000}:9000"
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ${MAGIC_COMPARE_RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${MAGIC_COMPARE_RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_LOG_LEVEL: ${MAGIC_COMPARE_RUSTFS_LOG_LEVEL:-warn}
      MALLOC_ARENA_MAX: "2"
    command: ["/data"]
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  rustfs-init:
    image: amazon/aws-cli:2.36.44
    environment:
      AWS_ACCESS_KEY_ID: ${MAGIC_COMPARE_RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${MAGIC_COMPARE_RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      RUSTFS_S3_ENDPOINT: http://rustfs:9000
      RUSTFS_S3_BUCKET: ${MAGIC_COMPARE_RUSTFS_BUCKET:-magic-compare-local}
    entrypoint: ["/bin/sh", "/usr/local/bin/rustfs-init"]
    volumes:
      - ./docker/rustfs-init.sh:/usr/local/bin/rustfs-init:ro
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  internal-site-init:
    <<: *local-internal-site
    environment:
      <<: *rustfs-client-environment
    depends_on:
      rustfs-init:
        condition: service_completed_successfully

  internal-site:
    <<: *local-internal-site
    environment:
      <<: *rustfs-client-environment

volumes:
  rustfs-data:
  rustfs-logs:
