name: GHCR Docker

run-name: GHCR Docker • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ghcr-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI_COMPOSE_ARGS: -f docker-compose.yml -f docker/ci.compose.override.yml
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/magic-compare-web

jobs:
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  smoke:
    name: Smoke Test Runtime Image Path
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # RustFS is wired in via ci.compose.override.yml as a CI-only S3-compatible sidecar.
      # FORCE_PATH_STYLE is required for RustFS; production R2 uses false instead.
      MAGIC_COMPARE_HIDE_DEMO: "false"
      MAGIC_COMPARE_S3_BUCKET: magic-compare-ci
      MAGIC_COMPARE_S3_REGION: us-east-1
      MAGIC_COMPARE_S3_ENDPOINT: http://rustfs:9000
      MAGIC_COMPARE_S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/magic-compare-ci
      MAGIC_COMPARE_S3_ACCESS_KEY_ID: rustfsadmin
      MAGIC_COMPARE_S3_SECRET_ACCESS_KEY: rustfsadmin
      MAGIC_COMPARE_S3_FORCE_PATH_STYLE: "true"
      MAGIC_COMPARE_S3_INTERNAL_PREFIX: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image metadata
        id: image_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=magic-compare-web
            org.opencontainers.image.description=Magic Compare internal-site runtime image

      - name: Build the runtime image once
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/internal-site.Dockerfile
          pull: true
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/magic-compare-internal-site.tar
          # The Docker archive is loaded for smoke and is the exact image later pushed to GHCR.
          provenance: false
          tags: magic-compare/internal-site:ci
          build-args: |
            MAGIC_COMPARE_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ghcr-docker-amd64
          cache-to: type=gha,mode=max,scope=ghcr-docker-amd64
          labels: ${{ steps.image_meta.outputs.labels }}

      - name: Load runtime image for smoke test
        run: docker load --input /tmp/magic-compare-internal-site.tar

      - name: Record runtime image size
        run: |
          image_size_bytes="$(docker image inspect magic-compare/internal-site:ci --format '{{.Size}}')"
          largest_layer="$(docker history magic-compare/internal-site:ci --no-trunc --format '{{.Size}}' | sort -hr | head -n 1)"
          {
            echo "## Runtime Image Size"
            echo
            printf -- '- Total bytes: `%s`\n' "$image_size_bytes"
            printf -- '- Largest layer: `%s`\n' "$largest_layer"
            printf '%s\n' '- Measurement only; releases are not blocked by a size threshold.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start compose stack
        run: docker compose $CI_COMPOSE_ARGS up -d --no-build internal-site rustfs

      - name: Wait for runtime readiness
        run: |
          set -euo pipefail
          for _ in {1..120}; do
            internal_site_init_container_id="$(docker compose $CI_COMPOSE_ARGS ps -a -q internal-site-init)"
            if [[ -n "$internal_site_init_container_id" ]]; then
              internal_site_init_status="$(docker inspect -f '{{.State.Status}}' "$internal_site_init_container_id")"
              if [[ "$internal_site_init_status" == "exited" ]]; then
                internal_site_init_exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$internal_site_init_container_id")"
                if [[ "$internal_site_init_exit_code" != "0" ]]; then
                  echo "internal-site-init exited with code $internal_site_init_exit_code."
                  docker compose $CI_COMPOSE_ARGS ps
                  docker compose $CI_COMPOSE_ARGS logs rustfs rustfs-init internal-site-init internal-site
                  exit 1
                fi
              fi
            fi

            internal_site_container_id="$(docker compose $CI_COMPOSE_ARGS ps -a -q internal-site)"
            if [[ -n "$internal_site_container_id" ]]; then
              internal_site_status="$(docker inspect -f '{{.State.Status}}' "$internal_site_container_id")"
              if [[ "$internal_site_status" == "exited" || "$internal_site_status" == "dead" ]]; then
                internal_site_exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$internal_site_container_id")"
                echo "internal-site exited with code $internal_site_exit_code before readiness."
                docker compose $CI_COMPOSE_ARGS ps
                docker compose $CI_COMPOSE_ARGS logs rustfs rustfs-init internal-site-init internal-site
                exit 1
              fi
            fi

            if curl -fsS http://127.0.0.1:3000/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for internal-site to become ready."
          docker compose $CI_COMPOSE_ARGS ps
          docker compose $CI_COMPOSE_ARGS logs rustfs rustfs-init internal-site-init internal-site
          exit 1

      - name: Verify demo seed ran
        run: |
          set -euo pipefail
          # Demo seed writes a manifest to object storage and metadata to SQLite.
          # Verify internal-site can serve the demo case page as a proxy for seed success.
          if ! curl -fsS "http://127.0.0.1:3000/cases/demo-grain-study" >/dev/null; then
            echo "Demo case page not accessible — seed may have failed."
            docker compose $CI_COMPOSE_ARGS logs internal-site-init internal-site
            exit 1
          fi

      - name: Capture compose logs
        if: always()
        run: |
          {
            docker compose $CI_COMPOSE_ARGS ps || true
            echo
            docker compose $CI_COMPOSE_ARGS logs rustfs rustfs-init internal-site-init internal-site || true
          } > ghcr-smoke.compose.log

      - name: Write smoke summary
        if: always()
        run: |
          {
            echo "## GHCR Smoke Summary"
            echo
            printf '%s\n' '- Compose files: `docker-compose.yml` + `docker/ci.compose.override.yml`'
            printf -- '- Runtime image target: `%s`\n' "$IMAGE_NAME"
            printf '%s\n' '- Object storage: RustFS CI sidecar on port 9000'
            printf '%s\n' '- Readiness probe: `http://127.0.0.1:3000/api/healthz`'
            printf '%s\n' '- Demo seed: enabled (`MAGIC_COMPARE_HIDE_DEMO=false` plus CI S3 env)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ghcr-smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ghcr-smoke.compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop compose stack
        if: always()
        run: docker compose $CI_COMPOSE_ARGS down --volumes --remove-orphans

      - name: Upload verified runtime image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/magic-compare-internal-site.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GHCR Image
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=magic-compare-web
            org.opencontainers.image.description=Magic Compare internal-site runtime image

      - name: Download verified runtime image
        uses: actions/download-artifact@v4
        with:
          name: ghcr-runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/magic-compare-runtime-image

      - name: Load and verify runtime image
        run: |
          set -euo pipefail
          docker load --input /tmp/magic-compare-runtime-image/magic-compare-internal-site.tar
          image_revision="$(docker image inspect magic-compare/internal-site:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$image_revision" != "$GITHUB_SHA" ]]; then
            echo "The smoke-tested runtime image was built for $image_revision, not $GITHUB_SHA."
            exit 1
          fi

      - name: Tag and push verified runtime image
        id: push
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag=""
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker tag magic-compare/internal-site:ci "$tag"
            docker push "$tag"
            [[ -z "$first_tag" ]] && first_tag="$tag"
          done <<< "$RELEASE_TAGS"
          [[ -n "$first_tag" ]] || { echo "No release tag was generated."; exit 1; }
          printf 'tag=%s\n' "$first_tag" >> "$GITHUB_OUTPUT"

      - name: Write publish summary
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## GHCR Publish Summary"
            echo
            printf -- '- Image: `%s`\n' "$IMAGE_NAME"
            printf -- '- Revision: `%s`\n' "$GITHUB_SHA"
            echo '- Tags:'
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && printf '  - `%s`\n' "$tag"
            done <<< "$RELEASE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
