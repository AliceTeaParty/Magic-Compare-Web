# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # pnpm workspace. Dependabot's npm updater reads the root lockfile and workspace manifests.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      react-and-types:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "major"
          - "minor"
          - "patch"
      prisma-and-client:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      npm-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "prisma"
          - "@prisma/*"
        update-types:
          - "patch"
      npm-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@mui/*"
          - "@prisma/*"
          - "prisma"
          - "sharp"
          - "@playwright/*"
          - "wrangler"
        update-types:
          - "minor"
    ignore:
      # The runtime major and its matching types move together after an explicit toolchain review.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3

  # GitHub Actions used by CI and image publishing.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Base images used by Dockerfiles.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    ignore:
      # Docker's Node major is pinned to .node-version and updated as one deliberate change.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"

  # Images pinned in docker/*.compose*.yml files.
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
